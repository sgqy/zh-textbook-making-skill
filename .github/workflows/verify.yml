name: 技能检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: 检查技能与独立安装包
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 获取仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 准备 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: 准备项目
        run: npm ci --ignore-scripts
      - name: 核对生成包并测试
        run: npm run verify
